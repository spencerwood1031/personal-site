<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spencer Wood</title>
<meta name="description" content="Spencer Wood — books, photography, and writing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --red: #e10600;
    --soft: #f7b5b2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); }
  body {
    color: var(--red);
    font-family: "Libre Franklin", "Franklin Gothic Medium", "Franklin Gothic", Arial, sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--red); }

  /* Layout: sidebar left, content right */
  .page {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 64px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 64px 56px 96px;
  }
  aside { position: sticky; top: 64px; align-self: start; }

  /* Masthead */
  header h1 {
    font-weight: 800;
    font-size: 56px;
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  header .tagline { margin-top: 14px; font-style: italic; font-weight: 500; font-size: 19px; }
  .thick { border: 0; border-top: 6px solid var(--red); margin: 28px 0 0; }
  .thin { border: 0; border-top: 1px solid var(--red); margin: 4px 0 0; }

  /* Nav */
  nav { display: flex; flex-direction: column; gap: 14px; margin-top: 36px; }
  nav a {
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: fit-content;
    border-bottom: 2px solid transparent;
  }
  nav a:hover { border-bottom-color: var(--soft); }
  nav a.active { border-bottom-color: var(--red); }

  .contact { display: flex; gap: 20px; margin-top: 40px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; }
  .contact a { text-decoration: none; }
  .contact a:hover { text-decoration: underline; }

  /* Sections */
  main { max-width: 820px; }
  section { display: none; }
  section.active { display: block; }
  h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  p + p { margin-top: 1em; }
  .lede { font-size: 26px; line-height: 1.35; margin-bottom: 1em; }

  /* Lists (books, articles) */
  .list { list-style: none; border-top: 2px solid var(--red); }
  .list li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--soft);
  }
  .list .meta { font-weight: 500; font-size: 17px; white-space: nowrap; align-self: baseline; }
  .list .note { grid-column: 1 / -1; font-weight: 500; font-size: 17px; font-style: italic; }
  .list a { text-decoration: none; }
  .list a:hover .title { text-decoration: underline; }

  /* Photography: a gallery with an uneven, magazine-like rhythm */
  main:has(#photography.active) { max-width: none; }
  .photos { display: flex; flex-direction: column; gap: 120px; }
  .row { display: flex; gap: 40px; align-items: flex-start; }
  .row figure { margin: 0; }
  .photos img, .photos .frame { display: block; width: 100%; height: auto; }
  .photos img { cursor: zoom-in; }
  .photos .frame {
    background: rgba(225, 6, 0, 0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-style: italic; font-weight: 500;
  }
  .frame.wide { aspect-ratio: 3 / 2; }
  .frame.tall { aspect-ratio: 2 / 3; }
  .photos figcaption { font-size: 15px; font-weight: 500; margin-top: 10px; }

  /* Wide photos: full width, or pushed left/right with empty space beside */
  .row.wide-full figure { width: 100%; }
  .row.wide-left figure { width: 72%; }
  .row.wide-right { justify-content: flex-end; }
  .row.wide-right figure { width: 72%; }
  /* Tall photos: a pair side by side, a staggered pair, or one alone */
  .row.tall-pair figure { width: calc(50% - 20px); }
  .row.tall-stagger { justify-content: space-between; }
  .row.tall-stagger figure { width: 40%; }
  .row.tall-stagger figure:last-child { margin-top: 22%; }
  .row.tall-left figure { width: 46%; margin-left: 8%; }
  .row.tall-right { justify-content: flex-end; }
  .row.tall-right figure { width: 46%; margin-right: 8%; }

  /* Photos fade in gently as you scroll to them */
  .row figure { opacity: 0; transform: translateY(24px); transition: opacity 0.9s ease, transform 0.9s ease; }
  .row figure.seen { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .row figure { opacity: 1; transform: none; transition: none; } }

  .small { font-size: 16px; font-weight: 500; margin-top: 32px; }

  /* Full-screen viewer */
  .viewer {
    position: fixed; inset: 0; background: #fff;
    display: none; align-items: center; justify-content: center;
    padding: 48px; z-index: 10; cursor: zoom-out;
  }
  .viewer.open { display: flex; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer button {
    position: absolute; background: none; border: 0; color: var(--red);
    font: 700 15px "Libre Franklin", "Franklin Gothic Medium", Arial, sans-serif; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; padding: 16px;
  }
  .viewer .close { top: 8px; right: 8px; }
  .viewer .prev { left: 8px; top: 50%; transform: translateY(-50%); }
  .viewer .next { right: 8px; top: 50%; transform: translateY(-50%); }

  @media (max-width: 860px) {
    .page { grid-template-columns: 1fr; gap: 40px; padding: 40px 16px 72px; }
    aside { position: static; }
    header h1 { font-size: clamp(44px, 12vw, 56px); }
    nav { flex-direction: row; flex-wrap: wrap; gap: 10px 22px; margin-top: 24px; }
    .contact { margin-top: 20px; }
    body { font-size: 17px; }
    .lede { font-size: 22px; }
    .photos { gap: 48px; }
    .row { flex-direction: column; gap: 48px; }
    .row figure, .row.tall-stagger figure { width: 100% !important; margin: 0 !important; }
    .viewer { padding: 16px; }
  }
</style>
</head>
<body>
<div class="page">

  <aside>
    <header>
      <h1>Spencer<br>Wood</h1>
      <p class="tagline">[Interested in human flourishing]</p>
      <hr class="thick"><hr class="thin">
    </header>

    <nav>
      <a href="#about" data-tab="about">About</a>
      <a href="#books" data-tab="books">Books</a>
      <a href="#photography" data-tab="photography">Photography</a>
      <a href="#articles" data-tab="articles">Articles</a>
    </nav>

    <div class="contact">
      <a href="mailto:spencer.wood1031@gmail.com">Email</a>
      <a href="https://www.linkedin.com/in/spencer-james-wood/">LinkedIn</a>
    </div>
  </aside>

  <main>
    <!-- ABOUT -->
    <section id="about">
      <h2>About</h2>
      <!-- The first paragraph (class="lede") shows in larger type. Add or remove <p> paragraphs as you like. -->
      <p class="lede">[Opening line about you]</p>
      <p>[Paragraph]</p>
      <p>[Paragraph]</p>
    </section>

    <!-- BOOKS -->
    <section id="books">
      <h2>Books</h2>
      <ul class="list">
        <li>
          <span class="title"><em>[Book title]</em></span>
          <span class="meta">[Author]</span>
        </li>
        <!-- To add a book, copy one <li>...</li> block above. Add an optional note line:
             <span class="note">One sentence on what you thought.</span> -->
      </ul>
    </section>

    <!-- PHOTOGRAPHY -->
    <section id="photography">
      <h2>Photography</h2>
      <div class="photos" id="photo-list"></div>
    </section>

    <!-- ARTICLES -->
    <section id="articles">
      <h2>Articles</h2>
      <ul class="list">
        <li>
          <span class="title">[Article title, or "Coming soon"]</span>
          <span class="meta"></span>
        </li>
        <!-- To add an article:
        <li>
          <a href="LINK-TO-ARTICLE"><span class="title">Article title</span></a>
          <span class="meta">Month Year</span>
          <span class="note">One-line description.</span>
        </li>
        -->
      </ul>
    </section>
  </main>

</div>

<div class="viewer" id="viewer">
  <button class="close" aria-label="Close">Close</button>
  <button class="prev" aria-label="Previous">←</button>
  <img alt="">
  <button class="next" aria-label="Next">→</button>
</div>

<script>
  // ---- PHOTOS ----
  // Put image files in a folder called "photos", then list them here in the
  // order you want them shown. "shape" (tall or wide) is optional; without it
  // the page works it out on its own. Caption is optional.
  const PHOTOS = [
    { src: "photos/01.jpg", shape: "wide" },
    { src: "photos/02.jpg", shape: "wide" },
    { src: "photos/03.jpg", shape: "tall" },
    { src: "photos/04.jpg", shape: "tall" },
    { src: "photos/05.jpg", shape: "wide" },
    { src: "photos/06.jpg", shape: "wide" },
    { src: "photos/07.jpg", shape: "tall" },
    { src: "photos/08.jpg", shape: "wide" },
    { src: "photos/09.jpg", shape: "wide" },
    { src: "photos/10.jpg", shape: "wide" },
    { src: "photos/11.jpg", shape: "tall" },
    { src: "photos/12.jpg", shape: "tall" },
    { src: "photos/13.jpg", shape: "wide" },
    { src: "photos/14.jpg", shape: "wide" },
    { src: "photos/15.jpg", shape: "tall" },
    { src: "photos/16.jpg", shape: "wide" },
    { src: "photos/17.jpg", shape: "wide" },
    { src: "photos/18.jpg", shape: "wide" },
    { src: "photos/19.jpg", shape: "tall" },
    { src: "photos/20.jpg", shape: "wide" },
    { src: "photos/21.jpg", shape: "wide" },
    // { src: "photos/lisbon.jpg", caption: "Lisbon, 2025" },
  ];

  // Until photos are added, show empty frames: 14 horizontal, 7 vertical.
  const SAMPLE = "WW TT WW T WWW TT WW T WWW T WW".replace(/ /g, "");

  const list = document.getElementById("photo-list");

  function getShape(src) {
    return new Promise(done => {
      const im = new Image();
      im.onload = () => done(im.naturalHeight > im.naturalWidth ? "tall" : "wide");
      im.onerror = () => done("wide");
      im.src = src;
    });
  }

  function makeFigure(item) {
    const fig = document.createElement("figure");
    if (item.src) {
      const img = document.createElement("img");
      img.src = item.src; img.alt = item.caption || ""; img.loading = "lazy";
      img.addEventListener("click", () => openViewer(item.index));
      fig.appendChild(img);
      if (item.caption) {
        const cap = document.createElement("figcaption");
        cap.textContent = item.caption;
        fig.appendChild(cap);
      }
    } else {
      const f = document.createElement("div");
      f.className = "frame " + item.shape;
      f.textContent = "[Photo " + (item.index + 1) + "]";
      fig.appendChild(f);
    }
    return fig;
  }

  // Groups photos into rows, rotating through different arrangements
  function layout(items) {
    const wideStyles = ["wide-full", "wide-right", "wide-left"];
    const pairStyles = ["tall-pair", "tall-stagger"];
    const soloStyles = ["tall-right", "tall-left"];
    let w = 0, p = 0, s = 0;
    for (let i = 0; i < items.length; i++) {
      const row = document.createElement("div");
      let group;
      if (items[i].shape === "wide") {
        row.className = "row " + wideStyles[w++ % 3];
        group = [items[i]];
      } else if (items[i + 1] && items[i + 1].shape === "tall") {
        row.className = "row " + pairStyles[p++ % 2];
        group = [items[i], items[++i]];
      } else {
        row.className = "row " + soloStyles[s++ % 2];
        group = [items[i]];
      }
      group.forEach(it => row.appendChild(makeFigure(it)));
      list.appendChild(row);
    }
    const watcher = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("seen"); watcher.unobserve(e.target); }
    }), { threshold: 0.15 });
    list.querySelectorAll("figure").forEach(f => watcher.observe(f));
  }

  if (PHOTOS.length === 0) {
    layout([...SAMPLE].map((c, i) => ({ shape: c === "T" ? "tall" : "wide", index: i })));
  } else {
    Promise.all(PHOTOS.map(p => p.shape || getShape(p.src))).then(shapes =>
      layout(PHOTOS.map((p, i) => ({ ...p, shape: shapes[i], index: i }))));
  }

  // ---- FULL-SCREEN VIEWER ----
  const viewer = document.getElementById("viewer");
  const vImg = viewer.querySelector("img");
  let current = 0;
  function openViewer(i) {
    current = (i + PHOTOS.length) % PHOTOS.length;
    vImg.src = PHOTOS[current].src;
    vImg.alt = PHOTOS[current].caption || "";
    viewer.classList.add("open");
  }
  function closeViewer() { viewer.classList.remove("open"); }
  viewer.addEventListener("click", closeViewer);
  viewer.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); openViewer(current - 1); });
  viewer.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); openViewer(current + 1); });
  document.addEventListener("keydown", e => {
    if (!viewer.classList.contains("open")) return;
    if (e.key === "Escape") closeViewer();
    if (e.key === "ArrowLeft") openViewer(current - 1);
    if (e.key === "ArrowRight") openViewer(current + 1);
  });

  // ---- TABS ----
  const tabs = ["about", "books", "photography", "articles"];
  function show() {
    const t = tabs.includes(location.hash.slice(1)) ? location.hash.slice(1) : "about";
    document.querySelectorAll("section").forEach(s => s.classList.toggle("active", s.id === t));
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.tab === t));
  }
  window.addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
