  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

  async function unlock(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(LOCKED.salt), iterations: LOCKED.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.data));
  }

  const form = document.getElementById("unlock"), pw = document.getElementById("pw");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    form.classList.remove("wrong");
    try {
      const pdf = await unlock(pw.value);
      const url = URL.createObjectURL(new Blob([pdf], { type: "application/pdf" }));
      document.getElementById("pdf").src = url;
      document.getElementById("open").href = url;
      const save = document.getElementById("save");
      save.href = url; save.download = "State of Affairs - Winter 2026.pdf";
      document.getElementById("wrap").classList.add("unlocked");
    } catch {
      void form.offsetWidth;   // restart the shake
      form.classList.add("wrong");
      pw.select();
    }
  });
</script>
